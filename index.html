<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сенсорная копилка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F7F4;--surface:#FFFFFF;--ink:#17332F;--muted:#5B7570;--line:#D5E4DE;
  --sun:#F7C04A;--sun-ink:#3A2A00;--coral:#E8624F;--teal:#1F6F66;--chip:#E3EFEA;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1D1B;--surface:#183029;--ink:#EAF4F0;--muted:#9DB8B1;--line:#274640;
  --sun:#F7C04A;--sun-ink:#3A2A00;--coral:#FF8470;--teal:#5BC2B6;--chip:#1F3B35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D1B;--surface:#183029;--ink:#EAF4F0;--muted:#9DB8B1;--line:#274640;--sun:#F7C04A;--sun-ink:#3A2A00;--coral:#FF8470;--teal:#5BC2B6;--chip:#1F3B35;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Rubik,system-ui,sans-serif;font-weight:700;font-size:30px;line-height:1.12;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{flex:1;border:0;border-radius:14px;padding:11px;font:600 16px Onest,sans-serif;background:var(--chip);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
fieldset{border:0;margin:0 0 14px;padding:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:9px 15px;font:500 16px Onest,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);border-color:var(--sun-ink)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.go{width:100%;border:0;border-radius:22px;padding:18px;margin:6px 0 20px;background:var(--coral);color:#fff;font:700 21px Rubik,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card{background:var(--surface);border-radius:28px;overflow:hidden;border:1px solid var(--line)}
.top{background:var(--sun);color:var(--sun-ink);padding:22px 20px;display:flex;align-items:center;gap:16px}
.emo{font-size:52px;line-height:1}
.top h2{font:700 24px/1.15 Rubik,sans-serif;margin:0}
.meta{margin:4px 0 0;font-weight:500;font-size:15px}
.body{padding:18px 20px 20px}
.body h3{font:700 16px Rubik,sans-serif;margin:0 0 6px}
.need{margin:0 0 16px}
ol{margin:0 0 16px;padding-left:22px}
li{margin-bottom:6px}
.skill{background:var(--chip);border-radius:14px;padding:11px 14px;font-size:15px;margin:0 0 16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn2{flex:1;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;padding:11px;font:600 16px Onest,sans-serif;cursor:pointer}
.btn2[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:22px;text-align:center;color:var(--muted)}
.fav{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;font:500 17px Onest,sans-serif;color:var(--ink);cursor:pointer}
.fav .emo{font-size:30px}
.fav small{display:block;color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;margin-top:24px}
.tab{min-width:30%;padding:10px 6px;font-size:15px}.pack{margin-bottom:22px}.pack h2{font:700 22px Rubik,sans-serif;margin:0 0 2px}.lock{opacity:.6}select{width:100%;padding:11px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px Onest,sans-serif}
.warn{background:#FFF1CC;color:#3A2A00;border-radius:14px;padding:11px 14px;font-size:15px;margin:0 0 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A2F10;color:#F7E3A6}}
:root[data-theme="dark"] .warn{background:#3A2F10;color:#F7E3A6}
input[type=search]{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px Onest,sans-serif;margin-bottom:6px}
#sres{margin-bottom:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Сенсорная копилка</h1>
  <p class="sub">Чем занять малыша прямо сейчас: выберите возраст и время, получите игру без долгой подготовки.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-ideas" aria-selected="true">Идеи</button>
    <button class="tab" role="tab" id="t-eve" aria-selected="false">Вечер</button>
    <button class="tab" role="tab" id="t-packs" aria-selected="false">Подписка</button>
    <button class="tab" role="tab" id="t-fav" aria-selected="false">Избранное (<span id="fcount">0</span>)</button>
  </div>

  <section id="v-ideas">
    <label for="q" class="sub" style="display:block;margin:0 0 6px">Найти игру по названию</label>
    <input type="search" id="q" placeholder="Например: мишка, вода, песок" autocomplete="off">
    <div id="sres" aria-live="polite"></div>
    <fieldset><legend>Возраст малыша</legend>
      <div class="row" id="f-age">
        <button class="chip" data-v="0" aria-pressed="false">6–12 мес</button>
        <button class="chip" data-v="1" aria-pressed="true">1–2 года</button>
        <button class="chip" data-v="2" aria-pressed="false">2–3 года</button>
      </div>
    </fieldset>
    <fieldset><legend>Сколько у вас времени</legend>
      <div class="row" id="f-time">
        <button class="chip" data-v="5" aria-pressed="false">5 минут</button>
        <button class="chip" data-v="15" aria-pressed="true">15 минут</button>
        <button class="chip" data-v="30" aria-pressed="false">30 минут</button>
      </div>
    </fieldset>
    <fieldset><legend>Какая игра</legend>
      <div class="row" id="f-mood">
        <button class="chip" data-v="*" aria-pressed="true">Любая</button>
        <button class="chip" data-v="c" aria-pressed="false">Спокойная</button>
        <button class="chip" data-v="a" aria-pressed="false">Активная</button>
      </div>
    </fieldset>
    <fieldset><legend>Где играем</legend>
      <div class="row" id="f-place">
        <button class="chip" data-v="*" aria-pressed="true">Везде</button>
        <button class="chip" data-v="h" aria-pressed="false">Дома</button>
        <button class="chip" data-v="o" aria-pressed="false">На улице</button>
      </div>
    </fieldset>
    <fieldset><legend><label for="f-sense">Что развиваем</label></legend>
      <select id="f-sense"><option value="*">Всё сразу</option><option value="ve">Баланс и движение</option><option value="pr">Ощущение тела</option><option value="vi">Зрение</option><option value="au">Слух</option><option value="ol">Обоняние</option><option value="ta">Вкус</option><option value="tc">Осязание</option><option value="in">Сигналы тела</option></select>
    </fieldset>
    <fieldset><legend>Что нужно для игры</legend>
      <div class="row" id="f-easy">
        <button class="chip" data-v="0" aria-pressed="true">Что есть под рукой</button>
        <button class="chip" data-v="1" aria-pressed="false">Совсем ничего</button>
      </div>
    </fieldset>
    <button class="go" id="go">Придумать игру</button>
    <div id="out" aria-live="polite"></div>
  </section>

  <section id="v-eve" hidden></section>
  <section id="v-packs" hidden></section>
  <section id="v-fav" hidden></section>

  <p class="note">Играйте рядом с малышом. Мелкие предметы, воду и еду давайте только под присмотром.</p>
</main>

{e:"👜",t:"Что в мешочке?",a:[1,2],m:5,n:["тканевый мешочек или носок","3 знакомых предмета"],s:["Положите предметы в мешочек.","Малыш на ощупь достаёт один.","Называйте предмет вместе."],k:"Тактильность и речь"},

function markFree(){
  var HOOK=["Танцы и «замри","Прятки под полотенцем","Пальчиковая игра","Кто так говорит","Буррито из одеяла","Колыбельная вполголоса","Тёплые ладошки","Дышим с мишкой","Пена в тазике","Коробка с крупой","Бутылка с блёстками","Рисование водой","Лодочка на коленях","Самолётик","Чистое бельё","Запах осени"];
  var order=["ve","pr","vi","au","ol","ta","tc","in"],q={},cnt={},i;
  function keys(x){var k=[];x.a.forEach(function(a){k.push("a"+a)});k.push(x.m<=5?"t5":x.m<=15?"t15":"t30");if(x.pl==="h"||x.pl==="b")k.push("ph");if(x.pl==="o"||x.pl==="b")k.push("po");return k}
  function can(x){return keys(x).every(function(k){return (cnt[k]||0)<5})}
  function take(x){x.fr=1;keys(x).forEach(function(k){cnt[k]=(cnt[k]||0)+1})}
  var sc={};order.forEach(function(s){sc[s]=0});
  HOOK.forEach(function(h){A.forEach(function(x){if(!x.fr&&x.t.indexOf(h)===0){take(x);sc[x.sn]++}})});
  for(var guard=0;guard<80;guard++){
    var best=null,bs=0;
    A.forEach(function(x){
      if(x.fr)return;
      var d=keys(x).filter(function(k){return (cnt[k]||0)<5}).length;
      if(!d)return;
      var s=d*10-sc[x.sn]*3;
      if(s>bs){bs=s;best=x}
    });
    if(!best)break;
    take(best);sc[best.sn]++;
  }
  order.forEach(function(s){if(!sc[s]){var x=A.filter(function(y){return y.sn===s&&!y.fr&&y.m<=15&&y.md==="c"})[0];if(x){take(x);sc[s]++}}});
}

  out.innerHTML='<article class="card pop"><div class="top"><span class="emo" aria-hidden="true">'+it.e+'</span><div><h2>'+it.t+'</h2><p class="meta">'+(it.md==="a"?"Активная":"Спокойная")+' игра, '+({h:"дома",o:"на улице",b:"дома или на улице"})[it.pl]+', до '+it.m+' минут</p></div></div><div class="body">'+need+'<h3>Как играть</h3><ol>'+it.s.map(function(s){return"<li>"+s+"</li>"}).join("")+'</ol><p class="skill">Развиваем: '+it.k+'</p>'+(SAFE[it.t]?'<p class="warn"><b>Безопасность.</b> '+SAFE[it.t]+'</p>':'')+(st.age===0&&it.a.indexOf(0)>-1?'<p class="warn"><b>Для малышей 6–12 месяцев.</b> Играйте рядом и всё время смотрите на малыша. Игрушки и предметы должны быть крупнее кулачка и не помещаться в рот.</p>':'')+(isFood(it)?'<p class="warn"><b>В игре есть еда.</b> Если у малыша аллергия на продукт, замените его. Давайте еду маленькими кусочками, пока ребёнок сидит и вы рядом.</p>':'')+'<div class="acts"><button class="btn2" id="favb" aria-pressed="'+isF+'">'+(isF?"В избранном":"В избранное")+'</button><button class="btn2" id="shareb">Поделиться с подругой</button></div></div></article>'+(st.nt||"");

    if(navigator.share){navigator.share({text:txt}).catch(function(e){if(e&&e.name!=="AbortError")copy()})}else copy();
  };
  $("favb").onclick=function(){
    var i=favs.indexOf(id);
    if(i>-1)favs.splice(i,1);else{favs.push(id);track("f",id)}

  };

function isFood(it){
  if(it.sn==="ta")return true;
  var t=(it.t+" "+it.s.join(" ")).replace(/[Нн]е пробуйте[^.]*\./g,"").toLowerCase();
  var eat=/съеш|съед|откус|облиз|лизну|доедать|ест сам|попроб|пробуй|в рот|угост/.test(t);
  var food=/яблок|банан|лимон|сыр|йогурт|морков|каш|ягод|хлеб|печень|апельсин|мандарин|огур|арбуз|дын|груш|творог|тыкв|помидор|суп|компот|молок|овощ|фрукт|пюре|мороженое|бутерброд|выпечк|пирог|овсян|сухар|мякиш|брокколи|капуст/.test(t+" "+it.n.join(" ").toLowerCase());
  return eat&&food;
}
